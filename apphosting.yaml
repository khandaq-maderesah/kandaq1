# Firebase App Hosting (runs the Next.js app + API routes on Cloud Run).
# Docs: https://firebase.google.com/docs/app-hosting/configure

runConfig:
  minInstances: 0
  maxInstances: 2
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  # Public Firebase web config (the same values every browser already receives,
  # not secrets). Needed at BUILD time because Next.js inlines NEXT_PUBLIC_*.
  # Filled in from .env.local by scripts/gcp-setup.ps1.
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "AIzaSyDKbO-wxs2cRyeJM7v22vZxH4ZiK08hSak"
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "khendeq-8e17f.firebaseapp.com"
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "khendeq-8e17f"
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: "khendeq-8e17f.firebasestorage.app"
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "81893318100"
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:81893318100:web:e14e416eb367d219880a41"
  - variable: NEXT_PUBLIC_FIREBASE_DATABASE_URL
    value: "https://khendeq-8e17f-default-rtdb.europe-west1.firebasedatabase.app"

  # Public half of the Web Push key pair (Ustaz attendance reminders). The
  # private half is the vapid-private-key secret below. Needed at BUILD time
  # because Next.js inlines NEXT_PUBLIC_*.
  - variable: NEXT_PUBLIC_VAPID_PUBLIC_KEY
    value: "BPQv115U10e2Nz8yhwxB4udvLB_h-i7H-6osDeQwFCG32b1C0abdf5uJ_lsBikht8cIMD0ab_BqYmEi_8xdqrOc"

  - variable: APP_TIMEZONE
    value: Africa/Addis_Ababa
    availability:
      - RUNTIME

  # Shared secret Cloud Scheduler sends to /api/cron/missing-attendance.
  # Stored in Google Secret Manager (created by scripts/gcp-setup.ps1).
  - variable: CRON_SECRET
    secret: cron-secret
    availability:
      - RUNTIME

  # Secret half of the Web Push key pair, used by /api/cron/attendance-push.
  # Stored in Google Secret Manager (see scripts/gcp-setup.ps1).
  - variable: VAPID_PRIVATE_KEY
    secret: vapid-private-key
    availability:
      - RUNTIME
